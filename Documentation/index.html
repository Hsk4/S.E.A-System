<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.E.A System — Documentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"><style>
  :root {
    --red: #E8352A;
    --red-dim: #c42d22;
    --red-muted: rgba(232,53,42,0.08);
    --red-border: rgba(232,53,42,0.2);
    --bg: #0a0a0b;
    --bg-1: #111113;
    --bg-2: #18181b;
    --bg-3: #1f1f23;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --text: #e8e8e8;
    --text-muted: #888;
    --text-dim: #555;
    --accent-blue: #3b82f6;
    --accent-green: #22c55e;
    --accent-amber: #f59e0b;
    --accent-purple: #a78bfa;
    --sidebar-w: 260px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    display: flex;
    min-height: 100vh;
  }
  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar-w);
    min-height: 100vh;
    background: var(--bg-1);
    border-right: 1px solid var(--border);
    position: fixed;
    top: 0; left: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 100;
  }
  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .logo-icon {
    width: 34px; height: 34px;
    background: var(--red);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 13px;
    color: #fff;
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }
  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    line-height: 1.2;
  }
  .logo-sub {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 400;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .nav-section {
    padding: 16px 12px 6px;
  }
  .nav-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-dim);
    padding: 0 8px 8px;
    font-weight: 500;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px;
    border-radius: 6px;
    text-decoration: none;
    color: var(--text-muted);
    font-size: 13.5px;
    transition: all 0.15s;
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { background: var(--bg-2); color: var(--text); }
  .nav-item.active { background: var(--red-muted); color: var(--red); border: 1px solid var(--red-border); }
  .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.7; }
  .nav-item.active svg { opacity: 1; }
  .nav-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: 2px;
  }
  .sidebar-footer {
    margin-top: auto;
    padding: 16px;
    border-top: 1px solid var(--border);
  }
  .version-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }
  .v-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-green); }
  /* MAIN */
  .main {
    margin-left: var(--sidebar-w);
    flex: 1;
    min-height: 100vh;
  }
  /* TOP BAR */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10,10,11,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .breadcrumb span { color: var(--text-muted); }
  .breadcrumb .current { color: var(--text); }
  .topbar-badges {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tbadge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid;
  }
  .tbadge-flutter { background: rgba(59,130,246,0.1); color: #60a5fa; border-color: rgba(59,130,246,0.25); }
  .tbadge-mern { background: rgba(34,197,94,0.1); color: #4ade80; border-color: rgba(34,197,94,0.25); }
  /* CONTENT */
  .content {
    max-width: 860px;
    margin: 0 auto;
    padding: 52px 40px 100px;
  }
  /* PAGE SECTION */
  .page-section { display: none; }
  .page-section.active { display: block; }
  /* HERO */
  .hero {
    margin-bottom: 56px;
    padding-bottom: 48px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--red-muted);
    border: 1px solid var(--red-border);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    color: var(--red);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 22px;
  }
  .hero-eyebrow-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: 52px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1.5px;
    color: #fff;
    margin-bottom: 18px;
  }
  .hero h1 em { color: var(--red); font-style: normal; }
  .hero-desc {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 560px;
    line-height: 1.7;
    margin-bottom: 32px;
  }
  .hero-stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 10px;
  }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }
  .stat-label { font-size: 12px; color: var(--text-muted); line-height: 1.3; }
  /* SECTION HEADERS */
  .doc-h2 {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    margin-top: 52px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .doc-h2:first-child { margin-top: 0; }
  .doc-h2 .anchor-tag {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
    font-weight: 400;
    padding: 2px 8px;
    background: var(--bg-2);
    border-radius: 4px;
  }
  .doc-h3 {
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: #ddd;
    margin-top: 32px;
    margin-bottom: 10px;
    padding-left: 12px;
    border-left: 2px solid var(--red);
  }
  .doc-p {
    color: var(--text-muted);
    margin-bottom: 16px;
    font-size: 15px;
  }
  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 48px 0;
  }
  /* ROLE CARDS */
  .role-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    margin: 24px 0;
  }
  .role-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    transition: border-color 0.2s;
  }
  .role-card:hover { border-color: var(--border-hover); }
  .role-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .role-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .role-name {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
  }
  .role-platform {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }
  .role-features {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .role-features li {
    font-size: 12.5px;
    color: var(--text-muted);
    padding-left: 14px;
    position: relative;
  }
  .role-features li::before {
    content: '';
    position: absolute;
    left: 0; top: 8px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--text-dim);
  }
  /* FLOW STEPS */
  .flow-block {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin: 20px 0;
  }
  .flow-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .flow-header-label {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #ddd;
  }
  .flow-tag {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid;
    margin-left: auto;
  }
  .flow-steps { padding: 4px 0; }
  .flow-step {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 10px 18px;
    transition: background 0.15s;
  }
  .flow-step:hover { background: rgba(255,255,255,0.02); }
  .step-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--bg-3);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .step-text { font-size: 13.5px; color: var(--text-muted); }
  .step-text strong { color: var(--text); font-weight: 500; }
  /* CALLOUT */
  .callout {
    border-radius: 10px;
    padding: 14px 18px;
    margin: 20px 0;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    font-size: 13.5px;
  }
  .callout-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .callout-info { background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2); color: #93c5fd; }
  .callout-warn { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); color: #fcd34d; }
  .callout-danger { background: rgba(232,53,42,0.08); border: 1px solid rgba(232,53,42,0.2); color: #fca5a5; }
  .callout-success { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); color: #86efac; }
  .callout p { margin: 0; line-height: 1.6; }
  .callout strong { color: inherit; }
  /* CODE BLOCK */
  .code-block {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 16px 0;
  }
  .code-header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-2);
  }
  .code-lang {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .code-body {
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre;
  }
  .code-kw { color: #c792ea; }
  .code-str { color: #c3e88d; }
  .code-comment { color: #546e7a; font-style: italic; }
  .code-type { color: #82aaff; }
  .code-fn { color: #82b1ff; }
  .code-num { color: #f78c6c; }
  /* SCOPE TABLE */
  .scope-table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    font-size: 13.5px;
  }
  .scope-table th {
    text-align: left;
    padding: 10px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .scope-table td {
    padding: 9px 14px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    vertical-align: top;
    line-height: 1.5;
  }
  .scope-table tr:hover td { background: rgba(255,255,255,0.015); }
  .tag-in {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(34,197,94,0.1); color: #4ade80;
    border: 1px solid rgba(34,197,94,0.2);
    padding: 1px 8px; border-radius: 20px; font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
  }
  .tag-out {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(245,158,11,0.1); color: #fbbf24;
    border: 1px solid rgba(245,158,11,0.2);
    padding: 1px 8px; border-radius: 20px; font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
  }
  /* STACK TABLE */
  .stack-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .stack-row:last-child { border-bottom: none; }
  .stack-layer {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    width: 100px;
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .stack-tech {
    font-size: 13.5px;
    color: var(--text);
    font-weight: 500;
  }
  .stack-note { font-size: 12px; color: var(--text-dim); margin-left: auto; font-family: 'JetBrains Mono', monospace; }
  /* DISPATCH FLOW */
  .dispatch-chain {
    display: flex;
    align-items: center;
    gap: 0;
    margin: 24px 0;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .dispatch-node {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    text-align: center;
    min-width: 120px;
    flex-shrink: 0;
  }
  .dispatch-node .dn-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .dispatch-node .dn-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .dispatch-node .dn-time { font-size: 10px; color: var(--text-dim); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }
  .dispatch-arrow {
    padding: 0 4px;
    color: var(--text-dim);
    font-size: 18px;
    flex-shrink: 0;
  }
  .dispatch-node.primary { border-color: var(--red-border); background: var(--red-muted); }
  .dispatch-node.primary .dn-name { color: #fca5a5; }
  .dispatch-node.secondary { border-color: rgba(245,158,11,0.25); background: rgba(245,158,11,0.06); }
  .dispatch-node.secondary .dn-name { color: #fbbf24; }
  .dispatch-node.tertiary { border-color: rgba(59,130,246,0.25); background: rgba(59,130,246,0.06); }
  .dispatch-node.tertiary .dn-name { color: #60a5fa; }
  /* INVARIANT CARDS */
  .invariant-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 20px 0;
  }
  .invariant-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .inv-num {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--text-dim);
    min-width: 24px;
    flex-shrink: 0;
    line-height: 1;
    margin-top: 2px;
  }
  .inv-text { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; }
  .inv-text strong { color: var(--text); font-weight: 500; }
  /* CRITERIA GRID */
  .criteria-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
    margin: 20px 0;
  }
  .criteria-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .criteria-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .criteria-icon {
    width: 22px; height: 22px;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  .criteria-items { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .criteria-items li {
    font-size: 12.5px;
    color: var(--text-muted);
    padding-left: 16px;
    position: relative;
    line-height: 1.5;
  }
  .criteria-items li::before {
    content: '';
    position: absolute;
    left: 0; top: 7px;
    width: 5px; height: 5px;
    border-radius: 1px;
    background: var(--text-dim);
    transform: rotate(45deg);
  }
  /* METRIC BADGE */
  .metric-inline {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    padding: 1px 8px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent-green);
  }
  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 10px; }
  /* RESPONSIVE MOBILE */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { margin-left: 0; }
    .content { padding: 32px 20px 80px; }
    .hero h1 { font-size: 34px; }
    .topbar { padding: 0 20px; }
  }
  /* FOLDER TREE */
  .tree {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.9;
    overflow-x: auto;
    white-space: pre;
    margin: 16px 0;
  }
  .tree-dir { color: #60a5fa; }
  .tree-file { color: var(--text-muted); }
  .tree-comment { color: var(--text-dim); }
</style>
</head>
